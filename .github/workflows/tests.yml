name: SENSA verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: pip install -r backend/requirements-release.txt
      - run: python -m pip check
      - run: python -m ruff check backend scripts/validate_release.py scripts/video_smoke.py scripts/download_demo_videos.py scripts/check_reviewer.py scripts/publication_check.py scripts/build_static_reviewer.py
      - run: python -m ruff format --check backend scripts/validate_release.py scripts/video_smoke.py scripts/download_demo_videos.py scripts/check_reviewer.py scripts/publication_check.py scripts/build_static_reviewer.py
      - run: python -m pytest -q
      - run: python scripts/validate_release.py
      - run: python scripts/publication_check.py
      - run: python scripts/build_static_reviewer.py
      - run: docker compose --profile reviewer config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.production.yml --profile reviewer config --quiet
        env:
          SENSA_REVIEW_HOST: reviewer.example.invalid
      - run: docker compose build backend frontend reviewer
      - name: Start and check the shared SQLite stack
        run: |
          docker compose --profile reviewer up -d --wait
          curl --fail http://127.0.0.1:8000/api/health
          curl --fail http://127.0.0.1:3002/
          python scripts/check_reviewer.py http://127.0.0.1:3002
          docker compose exec -T backend python -c "from app.db import DB; from app.worker import active_worker_count; d=DB(); assert active_worker_count(d)==2"
          python scripts/video_smoke.py --base-url http://127.0.0.1:8000
      - name: Test the static reviewer in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/reviewer-e2e" --ignore-scripts --no-audit playwright@1.64.1
          docker run -d --name sensa-static-preview -p 127.0.0.1:3003:80 -v "$PWD/output/reviewer-static:/usr/share/caddy:ro" caddy:2.10.2-alpine
          curl --fail --retry 8 --retry-all-errors --retry-delay 1 --max-time 10 http://127.0.0.1:3003/ -o /dev/null
          python scripts/check_reviewer.py http://127.0.0.1:3003
          NODE_PATH="$RUNNER_TEMP/reviewer-e2e/node_modules" node scripts/check_reviewer_browser.cjs http://127.0.0.1:3003
      - if: always()
        run: |
          docker logs sensa-static-preview || true
          docker rm -f sensa-static-preview || true
      - if: always()
        run: docker compose down
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm test
          npm run build
          npm run typecheck
          npm run lint
          npm audit --audit-level=moderate
