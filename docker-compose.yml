x-runtime: &runtime
  build: ./backend
  environment: &environment
    SENSA_DATA_DIR: /app/data
    DATABASE_URL: sqlite:////app/data/sensa.db
    SENSA_WORKER_MODE: external
    SENSA_AUTH_MODE: signin
    SENSA_ORIGINS: http://127.0.0.1:3001,http://localhost:3001
    MODEL_API_KEY: ${MODEL_API_KEY:-}
  volumes:
    - media:/app/data
  restart: unless-stopped
services:
  backend:
    <<: *runtime
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *runtime
    command: ["python", "-m", "app.worker"]
    deploy:
      replicas: 2
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  reviewer:
    profiles: [reviewer]
    build:
      context: .
      dockerfile: infra/reviewer.Dockerfile
    ports:
      - "127.0.0.1:3002:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  media:
